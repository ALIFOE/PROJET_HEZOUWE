databases:
  - name: hezouwe-db
    databaseName: hezouwe
    user: hezouwe
    plan: free

services:
  - type: web
    name: hezouwe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Application
      - key: APP_NAME
        value: "COOP CA HEZOUWE"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://hezouwe-41vs.onrender.com
      - key: APP_KEY
        generateValue: true

      # Base de données PostgreSQL (auto-injectée depuis la DB Render)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: hezouwe-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hezouwe-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hezouwe-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hezouwe-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hezouwe-db
          property: password

      # Session / Cache / Queue
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_LIFETIME
        value: 120

      # Logs (stderr = visible dans les logs Render)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # Mail Gmail — À remplir manuellement dans le dashboard Render
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 465
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_FROM_NAME
        value: "COOP CA HEZOUWE"
      # MAIL_USERNAME       → à saisir dans Render Dashboard
      # MAIL_PASSWORD       → à saisir dans Render Dashboard (App Password Gmail)
      # MAIL_FROM_ADDRESS   → à saisir dans Render Dashboard

      # Stripe — À remplir manuellement dans le dashboard Render
      # STRIPE_KEY          → à saisir
      # STRIPE_SECRET       → à saisir

      # FedaPay — À remplir manuellement dans le dashboard Render
      # FEDAPAY_API_KEY     → à saisir (clé secrète sandbox)
      - key: FEDAPAY_ENV
        value: sandbox
